name: Auto-merge

on:
  pull_request_target: { types: [opened, reopened, ready_for_review, synchronize, closed] }

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  act:
    uses: oneshotmn/.github/.github/workflows/automerge.yml@main
    with:
      expected-author: "oneshot-pr-bot[bot]"
    secrets:
      app-id: ${{ secrets.ONESHOT_PR_APP_ID }}
      app-private-key: ${{ secrets.ONESHOT_PR_PRIVATE_KEY }}
