name: DepsInline

on:
  workflow_call:
    inputs:
      required-check-context:
        description: The commit status/check-run context that must be green (e.g. "check").
        required: false
        type: string
        default: "check"
      merge-method:
        required: false
        type: string
        default: "squash"
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  act:
    runs-on: ubuntu-latest
    steps:
      - run: echo hi
