# Substitutable tokens: __FLY_APP__, __FLY_REGION__ (default ord). The
# provisioner replaces these; nothing here is a secret.
app = "__FLY_APP__"
primary_region = "__FLY_REGION__"

[build]

[[mounts]]
  source = "wp_uploads"
  destination = "/var/www/html/wp-content/uploads"

[[services]]
  internal_port = 80
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # A plain http_check on "/" is unusable here: WordPress + force_https
  # answers "/" over plain HTTP with a 301 redirect, which a naive check
  # treats as unhealthy, which makes the Fly proxy refuse to route at all
  # ("could not find a good candidate within 40 attempts"). A TCP check
  # only proves Apache is accepting connections on port 80, which is true
  # the moment the container boots (self-install runs before Apache's
  # foreground exec in our entrypoint, but Apache itself is reachable
  # quickly and always answers something) — this is what avoids the
  # previous run's total routing failure.
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
